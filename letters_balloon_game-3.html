<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<!-- הגדרות קלות לשינוי נמצאות בתחילת הסקריפט (CONFIG) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>משחק האותיות</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }
        #top-bar {
            height: 50px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
        }
        #mic {
            font-size: 1.4rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #444;
            transition: background 0.2s;
            cursor: pointer;
        }
        #mic.on {
            background: #2ecc71;
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70%  { box-shadow: 0 0 0 12px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        #canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #heard-container {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 6px 22px;
            border-radius: 20px;
            border: 2px solid #e94560;
            font-size: 1.3rem;
            min-width: 160px;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            z-index: 5;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .start-btn {
            padding: 15px 40px;
            font-size: 1.8rem;
            background: #4ecc73;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2e8b46;
            font-weight: bold;
            margin-top: 20px;
            font-family: inherit;
        }
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .level-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .level-btn {
            padding: 10px 18px;
            font-size: 1.2rem;
            border-radius: 30px;
            border: 2px solid #4ecc73;
            background: transparent;
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        .level-btn.selected {
            background: #4ecc73;
        }
        #mic-status {
            margin-top: 18px;
            font-size: 1.1rem;
            text-align: center;
            max-width: 90%;
        }
        #mic-status.ok { color: #4ecc73; }
        #mic-status.bad { color: #ffb347; }
        .mic-btn {
            margin-top: 10px;
            padding: 10px 26px;
            font-size: 1.2rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            box-shadow: 0 4px 0 #a3283d;
        }
        .mic-btn:active { transform: translateY(3px); box-shadow: none; }
        #warning {
            color: #ffb347;
            font-size: 1rem;
            text-align: center;
            max-width: 90%;
            margin-top: 15px;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <div>ניקוד: <span id="score-val">0</span></div>
        <div id="mic" title="מיקרופון">🎤</div>
        <div>פסילות: <span id="lives-val">❤️❤️❤️</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="heard-container">
            <span id="heard">🎤 אמרו את האות</span>
        </div>
    </div>

    <div id="start-overlay">
        <h1 style="color: #4ecc73; font-size: 2.5rem; text-align: center; margin-bottom: 10px;">משחק האותיות הגדול</h1>
        <p style="font-size: 1.2rem; text-align: center; max-width: 85%;">
            אמרו בקול את שם האות שעל הבלון לפני שהוא מגיע לקו הסכנה!
        </p>
        <div style="margin-top: 10px; font-size: 1.1rem;">אילו אותיות?</div>
        <div class="level-row">
            <button class="level-btn selected" data-level="easy" onclick="selectLevel(this)">א׳ – י׳</button>
            <button class="level-btn" data-level="all" onclick="selectLevel(this)">כל האותיות</button>
        </div>
        <div id="mic-status">🎤 ממתין לאישור מיקרופון...</div>
        <button class="mic-btn" id="mic-btn" onclick="requestMic(true)">🎤 אשר מיקרופון</button>
        <button class="start-btn" onclick="startGame()">התחל משחק</button>
        <div id="warning"></div>
    </div>
</div>

<script>
    // ===================== CONFIG – הגדרות =====================
    const CONFIG = {
        startSpawnInterval: 300,   // מרווח בין בלונים בהתחלה (פריימים, 60 = שנייה). גדול יותר = פחות בלונים
        minSpawnInterval: 160,     // המרווח הקטן ביותר שהמשחק יגיע אליו
        minSpeed: 0.25,            // מהירות נפילה מינימלית
        speedRange: 0.15,          // תוספת מהירות אקראית
        maxBalloons: 4,            // מקסימום בלונים על המסך בבת אחת
        pointsPerHit: 10,
        lives: 3,
        wrongCostsLife: true       // האם אות לא נכונה מורידה לב
    };

    // ===================== האותיות ושמותיהן =====================
    // כל וריאציה שמנוע זיהוי הדיבור עשוי לכתוב עבור שם האות
    const LETTERS = [
        { l: 'א', names: ['אלף', 'אלאף', 'אלעף', 'alef', 'aleph'] },
        { l: 'ב', names: ['בית', 'בייט', 'בת', 'בט', 'בית׳', 'bet', 'beit', 'bait'] },
        { l: 'ג', names: ['גימל', 'גימעל', 'גמל', 'גימל׳', 'gimel', 'gimmel'] },
        { l: 'ד', names: ['דלת', 'דאלת', 'דלט', 'דלד', 'דאלט', 'dalet', 'daled'] },
        { l: 'ה', names: ['הא', 'הה', 'הי', 'hey', 'hei'] },
        { l: 'ו', names: ['וו', 'ואו', 'וואו', 'ואב', 'וב', 'vav', 'waw'] },
        { l: 'ז', names: ['זין', 'זיין', 'זאין', 'זאיין', 'zayin'] },
        { l: 'ח', names: ['חית', 'חת', 'חיט', 'חט', 'het', 'chet', 'khet'] },
        { l: 'ט', names: ['טית', 'טת', 'טיט', 'טט', 'tet'] },
        { l: 'י', names: ['יוד', 'יוט', 'יוּד', 'yod', 'yud'] },
        { l: 'כ', names: ['כף', 'כאף', 'חף', 'kaf', 'kaph', 'chaf'] },
        { l: 'ל', names: ['למד', 'לאמד', 'למת', 'lamed'] },
        { l: 'מ', names: ['מם', 'מאם', 'מים', 'mem'] },
        { l: 'נ', names: ['נון', 'נוּן', 'nun', 'noon'] },
        { l: 'ס', names: ['סמך', 'סמח', 'סאמך', 'samech', 'samekh'] },
        { l: 'ע', names: ['עין', 'עיין', 'איין', 'ayin'] },
        { l: 'פ', names: ['פא', 'פה', 'פי', 'פיי', 'pe', 'pey'] },
        { l: 'צ', names: ['צדי', 'צדיק', 'צאדי', 'צדיי', 'tsadi', 'tzadi'] },
        { l: 'ק', names: ['קוף', 'קוּף', 'kuf', 'qof', 'koof'] },
        { l: 'ר', names: ['ריש', 'רש', 'רייש', 'resh', 'reish'] },
        { l: 'ש', names: ['שין', 'שיין', 'סין', 'shin'] },
        { l: 'ת', names: ['תו', 'תיו', 'תאו', 'טאו', 'תאב', 'tav', 'taf'] }
    ];

    const FINALS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
    function normalize(s) {
        return s.toLowerCase()
            .replace(/[֑-ׇ]/g, '')            // ניקוד וטעמים
            .replace(/[׳״'"`.,!?;:\-()]/g, '')          // גרש, גרשיים, פיסוק
            .replace(/[ךםןףץ]/g, c => FINALS[c])        // אותיות סופיות
            .trim();
    }

    const NAME_TO_LETTER = new Map();
    LETTERS.forEach(({ l, names }) => {
        NAME_TO_LETTER.set(normalize(l), l);
        names.forEach(n => {
            const k = normalize(n);
            if (!NAME_TO_LETTER.has(k)) NAME_TO_LETTER.set(k, l);
        });
    });

    function wordToLetter(word) {
        return NAME_TO_LETTER.get(normalize(word)) || null;
    }

    // ===================== משתני משחק =====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const heardEl = document.getElementById('heard');
    const scoreVal = document.getElementById('score-val');
    const livesVal = document.getElementById('lives-val');
    const micEl = document.getElementById('mic');
    const warningEl = document.getElementById('warning');

    let width, height;
    let score = 0;
    let lives = CONFIG.lives;
    let isRunning = false;
    let level = 'easy';

    let balloons = [];
    let particles = [];
    let floatTexts = [];
    let spawnTimer = 0;
    let spawnInterval = CONFIG.startSpawnInterval;

    const BALLOON_COLORS = ['#3498db', '#9b59b6', '#f39c12', '#1abc9c', '#e67e22', '#fd79a8', '#00b8d4'];

    function resizeCanvas() {
        const container = document.getElementById('canvas-container');
        const dpr = window.devicePixelRatio || 1;
        width = container.clientWidth;
        height = container.clientHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function selectLevel(btn) {
        document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        level = btn.dataset.level;
    }

    function letterPool() {
        return level === 'easy' ? LETTERS.slice(0, 10) : LETTERS;
    }

    // ===================== בלון =====================
    class Balloon {
        constructor() {
            const onScreen = balloons.map(b => b.letter);
            let pool = letterPool().filter(x => !onScreen.includes(x.l));
            if (pool.length === 0) pool = letterPool();
            this.letter = pool[Math.floor(Math.random() * pool.length)].l;

            this.r = Math.max(34, Math.min(52, Math.min(width, height) * 0.09));
            this.rx = this.r;
            this.ry = this.r * 1.18;
            this.x = Math.random() * (width - this.rx * 2 - 20) + this.rx + 10;
            this.y = -this.ry - 10;
            this.speed = CONFIG.minSpeed + Math.random() * CONFIG.speedRange;
            this.color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
            this.wobble = Math.random() * Math.PI * 2;
            this.state = 'fly';   // fly | win | lose
            this.popTimer = 0;
            this.scale = 1;
        }

        update() {
            if (this.state === 'fly') {
                this.y += this.speed;
                this.wobble += 0.03;
            } else {
                this.popTimer++;
                this.scale = 1 + this.popTimer * 0.035;
            }
        }

        draw() {
            const x = this.x + (this.state === 'fly' ? Math.sin(this.wobble) * 4 : 0);
            const y = this.y;
            const rx = this.rx * this.scale;
            const ry = this.ry * this.scale;
            const color = this.state === 'win' ? '#2ecc71' : this.state === 'lose' ? '#e74c3c' : this.color;

            // חוט
            ctx.beginPath();
            ctx.moveTo(x, y + ry + 6);
            ctx.quadraticCurveTo(x + 8, y + ry + 22, x - 2, y + ry + 38);
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // קשר
            ctx.beginPath();
            ctx.moveTo(x - 6, y + ry + 7);
            ctx.lineTo(x + 6, y + ry + 7);
            ctx.lineTo(x, y + ry - 2);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();

            // גוף הבלון
            const grad = ctx.createRadialGradient(x - rx * 0.35, y - ry * 0.4, rx * 0.1, x, y, ry);
            grad.addColorStop(0, 'rgba(255,255,255,0.55)');
            grad.addColorStop(0.25, color);
            grad.addColorStop(1, color);
            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // האות
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.round(this.r * 1.15 * this.scale)}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.45)';
            ctx.shadowBlur = 4;
            ctx.fillText(this.letter, x, y + 2);
            ctx.shadowBlur = 0;
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.radius = Math.random() * 5 + 2;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8;
            this.alpha = 1;
            this.decay = Math.random() * 0.03 + 0.015;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.08;
            this.alpha -= this.decay;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    class FloatText {
        constructor(x, y, text, color) {
            this.x = x; this.y = y; this.text = text; this.color = color; this.alpha = 1;
        }
        update() { this.y -= 0.8; this.alpha -= 0.015; }
        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.font = 'bold 26px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    function createExplosion(x, y, isSuccess) {
        const color = isSuccess ? '#2ecc71' : '#e74c3c';
        for (let i = 0; i < 35; i++) particles.push(new Particle(x, y, color));
    }

    // ===================== צלילים =====================
    let actx = null;
    function ensureAudio() {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
    }

    function tone(freq, start, dur, type, vol, endFreq) {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, start);
        if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, start + dur);
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        o.connect(g).connect(actx.destination);
        o.start(start);
        o.stop(start + dur + 0.05);
    }

    function popNoise(start) {
        const len = Math.floor(actx.sampleRate * 0.15);
        const buf = actx.createBuffer(1, len, actx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        const src = actx.createBufferSource();
        src.buffer = buf;
        const g = actx.createGain();
        g.gain.value = 0.5;
        src.connect(g).connect(actx.destination);
        src.start(start);
    }

    function playWin() {
        if (!actx) return;
        const t = actx.currentTime;
        popNoise(t);
        [523, 659, 784, 1047].forEach((f, i) => tone(f, t + 0.06 + i * 0.09, 0.28, 'triangle', 0.35));
        tone(1319, t + 0.45, 0.4, 'sine', 0.2);
    }

    function playLose() {
        if (!actx) return;
        const t = actx.currentTime;
        popNoise(t);
        tone(392, t + 0.08, 0.3, 'sawtooth', 0.12, 370);
        tone(330, t + 0.4, 0.3, 'sawtooth', 0.12, 311);
        tone(262, t + 0.72, 0.6, 'sawtooth', 0.12, 180);
    }

    // ===================== זיהוי דיבור =====================
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let recSession = 0;
    let processed = {};
    let micBlocked = false;

    function setMic(on) { micEl.classList.toggle('on', on); }

    function startRecognition() {
        if (!SR || micBlocked) return;
        recSession++;
        const sid = recSession;
        processed = {};
        rec = new SR();
        rec.lang = 'he-IL';
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 3;

        rec.onstart = () => setMic(true);
        rec.onresult = (e) => {
            for (let i = e.resultIndex; i < e.results.length; i++) {
                handleResult(sid, i, e.results[i]);
            }
        };
        rec.onerror = (e) => {
            if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                micBlocked = true;
                heardEl.innerText = '⚠️ אין גישה למיקרופון';
            }
        };
        rec.onend = () => {
            setMic(false);
            if (isRunning && !micBlocked && sid === recSession) {
                setTimeout(() => { if (isRunning) startRecognition(); }, 200);
            }
        };
        try { rec.start(); } catch (err) { /* כבר פועל */ }
    }

    function stopRecognition() {
        recSession++;
        if (rec) { try { rec.abort(); } catch (err) {} }
        setMic(false);
    }

    // עיבוד תוצאה – עוברים מילה אחר מילה, כל מילה נספרת פעם אחת בלבד
    function handleResult(sid, i, result) {
        const key = sid + '-' + i;
        const st = processed[key] || { done: 0, matched: false };
        const text = result[0].transcript.trim();
        if (text) heardEl.innerText = 'שמעתי: ' + text;

        const words = text.split(/\s+/).filter(Boolean);
        for (let w = st.done; w < words.length; w++) {
            const letter = wordToLetter(words[w]);
            if (letter) {
                onSpokenLetter(letter);
                st.done = w + 1;
                st.matched = true;
            } else if (result.isFinal || w < words.length - 1) {
                st.done = w + 1;          // מילה גמורה שאינה אות – מדלגים
            } else {
                break;                     // מילה אחרונה שעוד עשויה להשתנות
            }
        }

        // אם לא זוהתה אף אות – ננסה את החלופות האחרות של המנוע
        if (result.isFinal && !st.matched) {
            outer:
            for (let a = 1; a < result.length; a++) {
                for (const wd of result[a].transcript.trim().split(/\s+/)) {
                    const letter = wordToLetter(wd);
                    if (letter) { onSpokenLetter(letter); st.matched = true; break outer; }
                }
            }
        }
        processed[key] = st;
    }

    function onSpokenLetter(letter) {
        if (!isRunning) return;
        const active = balloons.filter(b => b.state === 'fly');
        if (active.length === 0) return;
        heardEl.innerText = 'שמעתי: ' + letter;

        const match = active.filter(b => b.letter === letter).sort((a, b) => b.y - a.y)[0];
        if (match) {
            match.state = 'win';
            score += CONFIG.pointsPerHit;
            floatTexts.push(new FloatText(match.x, match.y - match.ry, '+' + CONFIG.pointsPerHit + ' כל הכבוד!', '#2ecc71'));
            playWin();
        } else {
            const lowest = active.sort((a, b) => b.y - a.y)[0];
            lowest.state = 'lose';
            floatTexts.push(new FloatText(lowest.x, lowest.y - lowest.ry, 'זו האות ' + lowest.letter, '#ff7675'));
            playLose();
            if (CONFIG.wrongCostsLife) loseLife();
        }
        updateUI();
    }

    // בדיקה ממקלדת מחשב: הקשה על אות עברית מדמה אמירה שלה
    window.addEventListener('keydown', (e) => {
        if (!isRunning) return;
        const k = FINALS[e.key] || e.key;
        if (LETTERS.some(x => x.l === k)) onSpokenLetter(k);
    });

    micEl.addEventListener('click', () => {
        if (isRunning && !micBlocked) { stopRecognition(); startRecognition(); }
    });

    // ===================== אישור מיקרופון =====================
    let micGranted = false;
    const micStatusEl = document.getElementById('mic-status');
    const micBtn = document.getElementById('mic-btn');

    function setMicStatus(text, cls) {
        micStatusEl.innerText = text;
        micStatusEl.className = cls || '';
    }

    // מבקש מהדפדפן הרשאת מיקרופון (מקפיץ את חלונית האישור)
    async function requestMic(fromButton) {
        if (micGranted) return true;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setMicStatus('⚠️ הדפדפן לא מאפשר מיקרופון כאן. פתחו את הקובץ ב-Chrome, או מכתובת https.', 'bad');
            return false;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(t => t.stop());   // משחררים – זיהוי הדיבור יפתח את המיקרופון בעצמו
            micGranted = true;
            micBlocked = false;
            setMicStatus('✅ המיקרופון מאושר – אפשר להתחיל!', 'ok');
            micBtn.style.display = 'none';
            return true;
        } catch (err) {
            if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
                setMicStatus('⚠️ הגישה למיקרופון נחסמה. לחצו על סמל המנעול/ההגדרות ליד הכתובת ← מיקרופון ← אפשר, ורעננו את הדף.', 'bad');
            } else if (err.name === 'NotFoundError') {
                setMicStatus('⚠️ לא נמצא מיקרופון במכשיר.', 'bad');
            } else if (!fromButton) {
                setMicStatus('🎤 לחצו על "אשר מיקרופון" כדי לאפשר גישה', '');
            } else {
                setMicStatus('⚠️ לא הצלחנו להפעיל את המיקרופון (' + err.name + ')', 'bad');
            }
            return false;
        }
    }

    // בקשת אישור אוטומטית מיד עם פתיחת הקובץ
    window.addEventListener('load', () => {
        if (!SR) {
            warningEl.innerText = 'הדפדפן הזה לא תומך בזיהוי דיבור. מומלץ לפתוח ב-Chrome (מחשב או אנדרואיד) או Safari באייפון.';
        }
        if (navigator.permissions && navigator.permissions.query) {
            navigator.permissions.query({ name: 'microphone' }).then(p => {
                if (p.state === 'granted') requestMic(false);
                else if (p.state === 'denied') setMicStatus('⚠️ הגישה למיקרופון נחסמה. לחצו על סמל המנעול/ההגדרות ליד הכתובת ← מיקרופון ← אפשר, ורעננו את הדף.', 'bad');
                else requestMic(false);
            }).catch(() => requestMic(false));
        } else {
            requestMic(false);
        }
    });

    // ===================== מהלך המשחק =====================
    async function startGame() {
        ensureAudio();
        if (!micGranted) {
            const ok = await requestMic(true);
            if (!ok) return;   // נשארים במסך הפתיחה עם הסבר
        }
        if (!SR) {
            warningEl.innerText = 'הדפדפן הזה לא תומך בזיהוי דיבור. מומלץ לפתוח ב-Chrome (מחשב או אנדרואיד) או Safari באייפון.';
        }
        document.getElementById('start-overlay').style.display = 'none';
        score = 0;
        lives = CONFIG.lives;
        balloons = [];
        particles = [];
        floatTexts = [];
        spawnTimer = CONFIG.startSpawnInterval - 60;   // בלון ראשון אחרי שנייה
        spawnInterval = CONFIG.startSpawnInterval;
        micBlocked = false;
        isRunning = true;
        heardEl.innerText = '🎤 אמרו את האות';
        updateUI();
        startRecognition();
        requestAnimationFrame(gameLoop);
    }

    function updateUI() {
        scoreVal.innerText = score;
        livesVal.innerText = lives > 0 ? '❤️'.repeat(lives) : '💔';
    }

    function loseLife() {
        lives--;
        updateUI();
        if (lives <= 0) setTimeout(gameOver, 700);
    }

    function gameLoop() {
        if (!isRunning) return;

        ctx.clearRect(0, 0, width, height);

        // קו סכנה אדום
        const dangerY = height - 15;
        ctx.beginPath();
        ctx.moveTo(0, dangerY);
        ctx.lineTo(width, dangerY);
        ctx.strokeStyle = '#e94560';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        // יצירת בלונים חדשים
        if (lives > 0) {
            spawnTimer++;
            const flying = balloons.filter(b => b.state === 'fly').length;
            if (spawnTimer >= spawnInterval && flying < CONFIG.maxBalloons) {
                balloons.push(new Balloon());
                spawnTimer = 0;
                if (spawnInterval > CONFIG.minSpawnInterval) spawnInterval -= 2;
            }
        }

        // עדכון וציור בלונים
        for (let i = balloons.length - 1; i >= 0; i--) {
            const b = balloons[i];
            b.update();
            b.draw();

            if (b.state !== 'fly' && b.popTimer > 14) {
                createExplosion(b.x, b.y, b.state === 'win');
                balloons.splice(i, 1);
                continue;
            }

            // חציית קו הסכנה
            if (b.state === 'fly' && b.y + b.ry >= dangerY) {
                createExplosion(b.x, dangerY, false);
                floatTexts.push(new FloatText(b.x, dangerY - 30, 'זו האות ' + b.letter, '#ff7675'));
                balloons.splice(i, 1);
                playLose();
                loseLife();
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw();
            if (p.alpha <= 0) particles.splice(i, 1);
        }

        for (let i = floatTexts.length - 1; i >= 0; i--) {
            const f = floatTexts[i];
            f.update();
            f.draw();
            if (f.alpha <= 0) floatTexts.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        if (!isRunning) return;
        isRunning = false;
        stopRecognition();
        const overlay = document.getElementById('start-overlay');
        overlay.querySelector('h1').innerText = 'המשחק הסתיים!';
        overlay.querySelector('p').innerText = `הגעתם לניקוד של ${score} נקודות. כל הכבוד!`;
        overlay.querySelector('.start-btn').innerText = 'נסה שוב';
        overlay.style.display = 'flex';
    }
</script>
